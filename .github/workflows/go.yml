name: Build SolarLegio

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            goos: linux
            output_name: solarlegio-linux-amd64
            run_tests: true
          - goarch: arm64
            goos: linux
            output_name: solarlegio-linux-arm64
            run_tests: false
          - goarch: arm
            goos: linux
            output_name: solarlegio-linux-armv7
            run_tests: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.x'
        cache: false # Disable caching because we only use standard library (no go.sum)

    - name: Run Unit Tests
      if: matrix.run_tests == true
      run: go test -v ./...

    - name: Build Binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: go build -o ${{ matrix.output_name }} main.go

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.output_name }}
        path: ${{ matrix.output_name }}
