name: Build SolarLegio

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build for ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Für normale Linux Server / PCs
          - goarch: amd64
            goos: linux
            output_name: solarlegio-linux-amd64
          # Für Raspberry Pi 3, 4, 5 (mit 64-bit OS - Empfohlen)
          - goarch: arm64
            goos: linux
            output_name: solarlegio-linux-arm64
          # Für ältere Raspberry Pis oder 32-bit OS
          - goarch: arm
            goos: linux
            output_name: solarlegio-linux-armv7

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.x'

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: go build -o ${{ matrix.output_name }} main.go

    - name: Test
      # Tests laufen nur auf der Architektur des Runners (amd64)
      if: matrix.goarch == 'amd64'
      run: go test -v ./...

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.output_name }}
        path: ${{ matrix.output_name }}
